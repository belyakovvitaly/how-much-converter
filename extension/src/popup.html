<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>How Much?</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>How Much? <span id="version" class="version"></span></h1>

    <label class="row toggle">
      <input type="checkbox" id="enabled" />
      <span>Convert prices on pages</span>
    </label>

    <label class="row">
      <span>Convert to</span>
      <select id="targetCurrency"></select>
    </label>

    <label class="row">
      <span>Treat "$" as</span>
      <select id="dollarAssumption"></select>
    </label>

    <div class="row rates">
      <span id="ratesStatus">Rates: loading…</span>
      <button id="refresh" type="button">Refresh</button>
    </div>

    <div class="reports">
      <div class="row">
        <button id="report" type="button">It didn't work here</button>
        <span id="reportStatus" class="muted"></span>
      </div>
      <p class="muted note">
        Saved on this computer only. Nothing is sent anywhere — use
        <strong>Copy</strong> to take a report out, or <strong>Report on
        GitHub</strong> to open an issue with it filled in.
      </p>

      <details id="reportList" hidden>
        <summary><span id="reportCount"></span></summary>
        <ul id="reportItems"></ul>
        <div class="row">
          <button id="copyReports" type="button">Copy</button>
          <button id="issueReports" type="button">Report on GitHub</button>
          <button id="clearReports" type="button">Clear</button>
        </div>
      </details>
    </div>

    <script src="currency.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
